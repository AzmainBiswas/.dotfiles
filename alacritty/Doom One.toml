# vim:ft=kitty

## name: Doom One
## author: Henrik Lissner <https://github.com/hlissner>
## license: MIT
## blurb: Inspired by Atom's One Dark color scheme.

[colors.primary]
background = "#282c34"
foreground = "#bbc2cf"
dim_foreground = "#5B6268"
bright_foreground = "#DFDFDF"

[colors.cursor]
text = "#282c34"
cursor = "#bbc2cf"

[colors.selection]
text = "#bbc2cf"
background = "#3f444a"

[colors.normal]
black   = "#2a2e38"
red     = "#ff6c6b"
green   = "#98be65"
yellow  = "#ECBE7B"
blue    = "#51afef"
magenta = "#c678dd"
cyan    = "#46D9FF"
white   = "#DFDFDF"

[colors.bright]
black   = "#3f444a"
red     = "#ff6655"
green   = "#99bb66"
yellow  = "#ECBE7B"
blue    = "#51afef"
magenta = "#c678dd"
cyan    = "#46D9FF"
white   = "#bbc2cf"

[colors.dim]
black   = "#2a2e38"
red     = "#bb5555"
green   = "#789d50"
yellow  = "#b99a62"
blue    = "#418bbf"
magenta = "#a361b5"
cyan    = "#38a9c5"
white   = "#9ca0a4"
