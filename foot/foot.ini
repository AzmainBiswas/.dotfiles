[main] 
# font=ComicShannsMono Nerd Font:size=10
font=JetBrainsMono Nerd Font:size=14
# font=UbuntuMono Nerd Font:size=10
# font=Fira Code:size=10.5
pad=5x5
initial-window-size-pixels=1650x900

[tweak]
grapheme-shaping=yes

[cursor]
style=underline

[bell]
system=no

[colors-dark]
alpha=0.96
background=1d2021
foreground=ebdbb2
regular0=282828
regular1=cc241d
regular2=98971a
regular3=d79921
regular4=458588
regular5=b16286
regular6=689d6a
regular7=a89984
bright0=928374
bright1=fb4934
bright2=b8bb26
bright3=fabd2f
bright4=83a598
bright5=d3869b
bright6=8ec07c
bright7=ebdbb2

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+f
scrollback-up-half-page=Control+u
scrollback-down-half-page=Control+d
fullscreen=Mod1+Return
# Alt+ enter to fullscreen


